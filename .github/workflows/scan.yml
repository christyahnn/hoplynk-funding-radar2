name: Scan funding sources

on:
  schedule:
    - cron: "0 13 * * *"   # ~6am Pacific / 9am Eastern
    - cron: "0 1 * * *"    # ~6pm Pacific / 9pm Eastern
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Run scrapers + merge
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        working-directory: scripts
        run: python run_all_scrapers.py

      # Only ever commits data/raw, data/normalized, and data/opportunities.json --
      # never manual-overrides.json, since that file is human-owned only and
      # this job doesn't touch it.
      - name: Commit and push if changed
        run: |
          git config user.name "hoplynk-funding-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/normalized data/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit."
          fi
